const EXTENSIONS = [".jpg", ".jpeg", ".png", ".webp", ".gif", ".mp4"];

const projectList = document.getElementById("project-list");
const content = document.getElementById("content");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const random = (min, max) => min + Math.random() * (max - min);
// The four versions (same values as at the end of the style section):
// layout upright (menu at the top) or wide (bar on the left) × input touch or mouse
const UPRIGHT = "(max-width: 760px) and (min-height: 480px)";
const isUpright = () => window.matchMedia(UPRIGHT).matches;
const isTouch = () => window.matchMedia("(hover: none)").matches;

// File name from the title: spaces -> _, special characters like [ ] are dropped
function fileName(title) {
  return title.trim().replace(/\s+/g, "_").replace(/[^\p{L}\p{N}_-]/gu, "");
}

// List of all files, written automatically by GitHub on every push (assets.json).
// Online the site reads only this one file instead of searching for every image.
// Locally (or if it is missing) the list from layout.js is used instead.
function loadJSON(file, local) {
  const fallback = () => local() || null;
  return location.protocol.startsWith("http")
    ? fetch(file, { cache: "no-cache" }).then(r => r.ok ? r.json() : fallback()).catch(fallback)
    : Promise.resolve(fallback());
}
const manifest = loadJSON("assets.json", () => window.LOCAL_ASSETS);
// Arrangement made with the gallery editor (editor.html)
const layoutData = loadJSON("layout.json", () => window.LOCAL_LAYOUT);

const encodePath = path => path.split("/").map(encodeURIComponent).join("/");
async function savedLayout(project) {
  const data = await layoutData;
  return (data && data.projects && data.projects[fileName(project.title)]) || null;
}
const fileOf = src => decodeURIComponent(src.split("/").pop());
// files in the order arranged in the editor: top to bottom, then left to right
const arrangedFiles = saved => saved.desktop.slice().sort((a, b) => a.y - b.y || a.x - b.x).map(e => e.file);

// Finds all files of a project; the result is cached
const mediaCache = {};
function media(project) {
  if (!mediaCache[project.slug]) {
    mediaCache[project.slug] = (async () => {
      const name = fileName(project.title);
      const files = await manifest;
      const saved = await savedLayout(project);

      // 1. Online: every image or video in the project folder counts, whatever its name
      if (files) {
        const prefix = `${ASSET_FOLDER}/${name}/`;
        const hidden = new Set((saved && saved.hidden) || []);
        let names = files
          .filter(f => f.startsWith(prefix) && !f.slice(prefix.length).includes("/"))
          .map(f => f.slice(prefix.length))
          .filter(n => EXTENSIONS.some(e => n.toLowerCase().endsWith(e)) && !hidden.has(n))
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        // order: as arranged in the editor (top to bottom, then left to right); new files at the end
        if (saved && saved.desktop) {
          const arranged = arrangedFiles(saved).filter(n => names.includes(n));
          names = arranged.concat(names.filter(n => !arranged.includes(n)));
        }
        return names.map(n => encodePath(prefix + n));
      }

      // 2. No list at all (editor not saved yet): show the files arranged in the editor
      if (!saved || !saved.desktop) return [];
      return arrangedFiles(saved).map(f => encodePath(`${ASSET_FOLDER}/${name}/${f}`));
    })();
  }
  return mediaCache[project.slug];
}

function placeholder(src) {
  const p = document.createElement("div");
  p.className = "placeholder";
  p.textContent = decodeURIComponent(src);
  return p;
}

// Video: muted, loops forever, no controls – like a GIF.
// preload "auto" = starts by itself; "metadata" / "none" = waits until the page starts it
function videoElement(src, alt, preload = "auto") {
  const v = document.createElement("video");
  v.src = src;
  v.muted = true;
  v.defaultMuted = true;
  v.loop = true;
  v.autoplay = preload === "auto";
  v.playsInline = true;
  v.preload = preload;
  v.setAttribute("muted", "");
  v.setAttribute("playsinline", "");
  v.setAttribute("aria-label", alt);
  v.addEventListener("loadeddata", () => {
    const slide = v.closest(".slide");
    // full view: only the current video plays, and only once it has arrived (not while turning)
    if (slide && (!slide.classList.contains("current") || stripTurning)) return;
    v.play().catch(() => { v.controls = true; });
  });
  v.addEventListener("error", () => v.replaceWith(placeholder(src)));
  return v;
}

// Image or video, depending on the file extension.
// eager: load the image right away (otherwise only when it comes near the screen)
function mediaElement(src, alt, { eager = false, videoPreload } = {}) {
  if (src.toLowerCase().endsWith(".mp4")) return videoElement(src, alt, videoPreload);
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  img.loading = eager ? "eager" : "lazy";
  img.decoding = "async";                    // the browser unpacks the image on the side, without stalling the page
  img.onerror = () => img.replaceWith(placeholder(src));
  return img;
}

/* ---------- Left menu ---------- */
projectList.innerHTML = projects.map(p =>
  `<li><a href="#${p.slug}"><span class="blur">${p.title}</span></a><span class="year">${p.year}</span></li>`
).join("");

const sidebar = document.querySelector(".sidebar");

// Touch: a tap switches the blur of the word on for a moment (.tap-blur), the CSS transition
// fades it in and out. Mouse: the blur comes from hovering, see the style section.
const TAP_BLUR = 700;                         // milliseconds until the blur is switched off again
let tapTimer = null;
function tapBlur(e) {
  const el = e.target.closest(".sidebar a, .subtitle")?.querySelector(".blur");
  if (!el) return;
  sidebar.querySelectorAll(".tap-blur").forEach(other => other.classList.remove("tap-blur"));   // only one word at a time
  el.classList.add("tap-blur");
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => el.classList.remove("tap-blur"), TAP_BLUR);
}

// Upright layout: the menu is fixed at the top, the content starts below it
function updateHeaderHeight() {
  document.documentElement.style.setProperty("--header-height", sidebar.offsetHeight + "px");
}
updateHeaderHeight();

/* ---------- Upright layout: collapsible project list ----------
   Two states: open ("archive −" + project list) and closed ("archive +").
   - tap or click "archive": open / close
   - start page: the list follows your finger (touch) or the wheel (mouse), and closes by itself after a while
   - project pages: scrolling down closes an open list (it never opens by itself) */
const MENU_AUTO_CLOSE = 5000;                 // start page: milliseconds until the open list closes by itself
const subtitle = document.getElementById("subtitle");
const signOpen = subtitle.querySelector(".sign-open");
const signClosed = subtitle.querySelector(".sign-closed");
const onSubpage = () => document.body.classList.contains("subpage");
let menuState = 0;                            // 0 = open, 1 = closed (values in between while swiping)
let autoClose = null, scrollStop = null, lastScrollY = 0;

// height of the open project list, measured once (not on every finger movement)
let listHeight = 1;
function measureList() { listHeight = Math.max(projectList.scrollHeight, 1); }
measureList();

function applyMenu() {
  if (!isUpright()) {                         // wide layout: always the normal menu
    projectList.style.maxHeight = projectList.style.opacity = projectList.style.pointerEvents = subtitle.style.marginBottom = "";
    signOpen.style.opacity = signClosed.style.opacity = "";
    return;
  }
  const p = menuState;
  projectList.style.maxHeight = (1 - p) * listHeight + "px";
  projectList.style.opacity = 1 - p;
  projectList.style.pointerEvents = p === 1 ? "none" : "";   // closed list: its empty edge doesn't cover "archive"
  subtitle.style.marginBottom = 20 * (1 - p) + "px";
  signOpen.style.opacity = Math.max(0, 1 - 2 * p);       // open: −
  signClosed.style.opacity = Math.max(0, 2 * p - 1);     // closed: +
  updateShadow();
}

// project pages: no shadow while the page is at the very top and the list is closed
function updateShadow() {
  sidebar.classList.toggle("flat", onSubpage() && window.scrollY <= 2 && menuState === 1);
}

function setMenu(state, animate) {
  stopFollow();
  menuState = Math.max(0, Math.min(1, state));
  sidebar.classList.toggle("menu-anim", !!animate);
  applyMenu();
  clearTimeout(autoClose);
  if (menuState === 0 && !onSubpage()) autoClose = setTimeout(() => setMenu(1, true), MENU_AUTO_CLOSE);
}

// moves the menu along with a swipe or scroll (dy > 0 closes it).
// Movements are collected and applied once per screen frame, so the menu moves evenly.
// ease = true (mouse wheel): a wheel notch is a big jump, so the menu glides there over a few frames.
let menuPending = 0, menuEase = false, menuFrame = null;
function menuFollow(dy, ease) {
  if (!isUpright()) return;
  clearTimeout(autoClose);
  menuPending += dy;
  menuEase = !!ease;
  if (!menuFrame) menuFrame = requestAnimationFrame(menuTick);
}
function menuTick() {
  menuFrame = null;
  const take = menuEase && Math.abs(menuPending) > 1 ? menuPending * 0.3 : menuPending;   // 0.3 = glide speed for the wheel
  menuPending -= take;
  sidebar.classList.remove("menu-anim");
  menuState = Math.max(0, Math.min(1, menuState + take / listHeight));
  if (menuState === 0 || menuState === 1) menuPending = 0;   // already fully open / closed
  applyMenu();
  if (menuPending) menuFrame = requestAnimationFrame(menuTick);
}
function stopFollow() {
  menuPending = 0;
  cancelAnimationFrame(menuFrame);
  menuFrame = null;
}

// start page, finger lifted: snap fully open or closed, depending on the last swipe direction
function menuSettle(dir) {
  if (!isUpright()) return;
  stopFollow();
  const target = dir > 0 ? (menuState > 0.2 ? 1 : 0) : dir < 0 ? (menuState < 0.8 ? 0 : 1) : Math.round(menuState);
  setMenu(target, true);
}

subtitle.addEventListener("click", () => { if (isUpright()) setMenu(menuState > 0.5 ? 0 : 1, true); });

sidebar.addEventListener("touchstart", e => {
  tapBlur(e);
  if (menuState === 0 && !onSubpage()) setMenu(0, false);   // touching the open list on the start page restarts the auto-close timer
}, { passive: true });

window.addEventListener("scroll", () => {
  const dy = window.scrollY - lastScrollY;
  lastScrollY = window.scrollY;
  if (onSubpage() && menuState < 1 && dy > 0) {             // project page: scrolling down folds the list in
    menuFollow(dy);
    clearTimeout(scrollStop);
    scrollStop = setTimeout(() => { if (menuState < 1) setMenu(1, true); }, 150);
  }
  updateShadow();
}, { passive: true });

/* ---------- Start page: floating images ---------- */
let floatRun = 0;      // increases on every page change and stops old animation loops
let layer = 1;

function startPage() {
  const run = ++floatRun;
  const area = document.createElement("div");
  area.className = "float-area";
  content.replaceChildren(area);
  document.title = "patrick walter — architecture";

  const height = () => area.clientHeight || window.innerHeight;
  const avgDuration = (FLOAT.durationMin + FLOAT.durationMax) / 2;
  let items = [];       // images currently on screen
  let push = 0;         // extra speed from scrolling (px/s)
  let distance = 0;     // distance travelled since the last new image
  let pool = [];        // all images/videos found across all projects
  let deck = [];        // shuffled deck: an image returns only after all others had their turn

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function nextMedia() {
    const onScreen = new Set(items.map(item => item.src));
    if (!deck.length) deck = shuffle([...pool]);
    let i = deck.findIndex(m => !onScreen.has(m.src));   // never the same image twice at once
    if (i < 0) i = 0;
    return deck.splice(i, 1)[0];
  }

  // Finds a horizontal position where the new image covers the others as little as possible
  function bestPosition(widthPct, y, heightPx) {
    const areaWidth = area.clientWidth;
    const w = areaWidth * widthPct / 100;
    let best = 0, bestScore = Infinity;
    for (let k = 0; k < 16; k++) {
      const left = Math.random() * (areaWidth - w);
      let score = 0;
      items.forEach(item => {
        const itemLeft = areaWidth * item.left / 100, itemWidth = areaWidth * item.width / 100;
        const overlapY = Math.min(y + heightPx, item.y + item.height()) - Math.max(y, item.y);
        const overlapX = Math.min(left + w, itemLeft + itemWidth) - Math.max(left, itemLeft);
        if (overlapX > 0 && overlapY > -heightPx * 0.5) score += overlapX * (overlapY + heightPx * 0.5);
      });
      if (score < bestScore) { bestScore = score; best = left; }
    }
    return best / areaWidth * 100;
  }

  function addImage(y) {
    const { project, src } = nextMedia();
    const a = document.createElement("a");
    a.href = "#" + project.slug;
    const widthPct = isUpright() ? random(FLOAT.widthMinMobile, FLOAT.widthMaxMobile) : random(FLOAT.widthMin, FLOAT.widthMax);
    const duration = random(FLOAT.durationMin, FLOAT.durationMax);
    const estimate = area.clientWidth * widthPct / 100 * 0.75;   // height before the image has loaded
    if (y === "top") y = -estimate - random(20, 80);
    const leftPct = bestPosition(widthPct, y, estimate);
    a.style.width = widthPct + "%";
    a.style.left = leftPct + "%";
    a.style.zIndex = layer++;
    const el = mediaElement(src, project.title, { eager: true });
    a.appendChild(el);
    const caption = document.createElement("span");
    caption.className = "caption";
    caption.textContent = project.title;
    a.appendChild(caption);
    area.appendChild(a);

    const item = {
      el: a, y, src,
      left: leftPct, width: widthPct,    // position and width in % (remembered, so nothing has to be measured)
      ratio: 0.75,                       // height / width, known once the image has loaded
      height: () => area.clientWidth * item.width / 100 * item.ratio,
      speed: height() / duration,        // own speed in px/s
      factor: avgDuration / duration,    // faster images react more strongly -> sense of depth
      paused: false,
      dragging: false
    };
    // the real proportions, read once as soon as the image or video knows its size
    const setRatio = () => {
      const w = el.naturalWidth || el.videoWidth, h = el.naturalHeight || el.videoHeight;
      if (w && h) item.ratio = h / w;
    };
    el.addEventListener("load", setRatio);
    el.addEventListener("loadedmetadata", setRatio);
    // mouse over an image: it stops (touch: no pause, a tap opens the project)
    a.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") item.paused = true; });
    a.addEventListener("pointerleave", () => item.paused = false);

    // Dragging with the mouse button held down
    let drag = null;          // start data of the current drag
    let moved = false;        // actually moved? then don't trigger a click
    a.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.pointerType !== "mouse") return;   // dragging only with a mouse
      e.preventDefault();
      a.setPointerCapture(e.pointerId);
      drag = { x: e.clientX, y: e.clientY, startY: item.y, startLeft: area.clientWidth * item.left / 100 };
      moved = false;
      item.dragging = true;
      a.classList.add("dragging");
      a.style.zIndex = layer++;             // grabbed image stays on top afterwards
    });
    a.addEventListener("pointermove", e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      const areaWidth = area.clientWidth;
      const left = Math.max(0, Math.min(areaWidth * (1 - item.width / 100), drag.startLeft + dx));
      item.left = left / areaWidth * 100;
      a.style.left = item.left + "%";
      item.y = drag.startY + dy;
      a.style.transform = `translateY(${item.y}px)`;
    });
    const release = () => {
      if (!drag) return;
      drag = null;
      item.dragging = false;
      a.classList.remove("dragging");
    };
    a.addEventListener("pointerup", release);
    a.addEventListener("pointercancel", release);
    a.addEventListener("click", e => { if (moved) e.preventDefault(); });
    a.addEventListener("dragstart", e => e.preventDefault());

    a.style.transform = `translateY(${y}px)`;
    items.push(item);
    return item;
  }

  // Scrolling over the images pushes them up or down
  area.addEventListener("wheel", e => {
    e.preventDefault();
    const d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? height() : 1);
    push = Math.max(-4000, Math.min(4000, push + d * FLOAT.scrollStrength));
    // upright layout: the project list folds in and out with the wheel, just like with a finger
    if (isUpright() && d) {
      menuFollow(d, true);
      clearTimeout(wheelStop);
      const dir = d;
      wheelStop = setTimeout(() => menuSettle(dir), 150);
    }
  }, { passive: false });
  let wheelStop = null;

  // Touch: swiping over the images moves them like scrolling
  let touchY = null, touchTime = 0;
  area.addEventListener("touchstart", e => {
    touchY = e.touches[0].clientY;
    touchTime = performance.now();
  }, { passive: true });
  let lastSwipe = 0;
  area.addEventListener("touchmove", e => {
    if (touchY === null) return;
    e.preventDefault();
    const y = e.touches[0].clientY;
    const now = performance.now();
    const dt = Math.max((now - touchTime) / 1000, 0.008);
    push = Math.max(-4000, Math.min(4000, (touchY - y) / dt));
    menuFollow(touchY - y);                  // the project list folds in and out with the finger
    if (touchY !== y) lastSwipe = touchY - y;
    touchY = y;
    touchTime = now;
  }, { passive: false });
  area.addEventListener("touchend", () => { touchY = null; menuSettle(lastSwipe); lastSwipe = 0; });

  let last = performance.now();
  function step(now) {
    if (run !== floatRun) return;             // page changed -> stop this loop
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    const h = height();
    const baseSpeed = reducedMotion ? 0 : h / avgDuration;

    items.forEach(item => {
      if (item.dragging) return;              // being dragged -> don't move
      const own = (item.paused || reducedMotion) ? 0 : item.speed;
      item.y -= (own + push * item.factor) * dt;
      item.el.style.transform = `translateY(${item.y}px)`;
    });

    // New images: from below when moving up – from above when scrolling back
    distance += (baseSpeed + push) * dt;
    const gapPx = (h / avgDuration) * (isUpright() ? FLOAT.gapMobile : FLOAT.gap);
    // at most one new image per frame, also when scrolling fast (keeps the page smooth)
    if (distance >= gapPx) { addImage(h + random(0, 60)); distance = Math.min(distance - gapPx, gapPx); }
    else if (distance <= -gapPx) { addImage("top"); distance = Math.max(distance + gapPx, -gapPx); }

    // Remove images that have left the area
    items = items.filter(item => {
      const gone = !item.dragging && (item.y + item.height() < -120 || item.y > h + 200);
      if (gone) item.el.remove();
      return !gone;
    });

    push *= Math.pow(1 - FLOAT.scrollGlide, dt * 2);
    if (Math.abs(push) < 1) push = 0;
    requestAnimationFrame(step);
  }

  // First find all files, then start
  Promise.all(projects.map(project => media(project).then(list => list.map(src => ({ project, src })))))
    .then(lists => {
      if (run !== floatRun) return;
      pool = lists.flat();
      if (!pool.length) return;
      // spread evenly over the height at the start
      const count = isUpright() ? FLOAT.startCountMobile : FLOAT.startCount;
      for (let i = 0; i < count; i++)
        addImage((i + random(0.1, 0.6)) / count * height());
      last = performance.now();
      requestAnimationFrame(step);
    });
}

/* ---------- Full view (lightbox) ---------- */
const lightbox = document.createElement("div");
lightbox.className = "lightbox";
lightbox.innerHTML = `
  <div class="lb-title"></div>
  <button class="close" type="button">close</button>
  <div class="stage"></div>
  <div class="strip"></div>
  <div class="counter"></div>`;
document.body.appendChild(lightbox);
const lbStage = lightbox.querySelector(".stage");
const lbStrip = lightbox.querySelector(".strip");
const lbCounter = lightbox.querySelector(".counter");
const lbTitle = lightbox.querySelector(".lb-title");
let lbList = [], lbIndex = 0, lbAlt = "";

// Mouse (also in a narrow window): horizontal strip; touchscreens: one image at a time with swipe and pinch-zoom
function openLightbox(list, index, title) {
  lbList = list;
  lbAlt = title;
  lbTitle.textContent = title;
  lightbox.classList.add("open");
  document.body.classList.add("lightbox-open");
  content.querySelectorAll("video").forEach(v => v.pause());   // videos on the page behind rest meanwhile
  if (isTouch()) showInLightbox(index);       // touchscreens: swipe and pinch (also turned sideways)
  else openStrip(index);
}

/* ---------- Mouse: one image at a time ----------
   - each scroll movement (wheel or trackpad) turns exactly one image further or back
   - click on an image: zoom in at that spot, moving the mouse looks around, click again: zoom out
   - click on the white area around the image: close                                          */
const CLICK_ZOOM = 2.5;      // magnification when clicking on an image
let stripIndex = 0;

// The images sit on a track that is moved sideways as a whole (smooth in every browser, also with videos)
const lbTrack = document.createElement("div");
lbTrack.className = "track";
lbStrip.appendChild(lbTrack);

let stripTurning = false, turnTimer = null;

// Turning finished: hide the previous image, then start the video (Firefox draws
// a black bar when a video starts while it is still sliding in)
function finishTurn() {
  if (!stripTurning) return;
  stripTurning = false;
  clearTimeout(turnTimer);
  markCurrent(stripIndex, -1, true);
}
lbTrack.addEventListener("transitionend", e => {
  if (e.target === lbTrack) finishTurn();
});

function openStrip(index) {
  lightbox.classList.add("strip-mode");
  stripIndex = index;
  // one empty page per image; the images themselves are added only when needed (see fillAround)
  lbTrack.replaceChildren(...lbList.map(() => {
    const slide = document.createElement("div");
    slide.className = "slide";
    return slide;
  }));
  fillAround(index);
  stripTurning = false;
  markCurrent(index, -1, true);
  moveTrack(index, false);
  lbCounter.textContent = `${index + 1} / ${lbList.length}`;
}

// Loads only the current image and its two neighbours, so opening the full view doesn't fetch the whole project
function fillAround(i) {
  [i - 1, i, i + 1].forEach(k => {
    const slide = lbTrack.children[k];
    if (!slide || slide.firstChild) return;   // outside the list, or already loaded
    const frame = document.createElement("div");
    frame.className = "frame";
    // videos start only when they are the current image
    frame.appendChild(mediaElement(lbList[k], lbAlt, { eager: true, videoPreload: "metadata" }));
    slide.appendChild(frame);
  });
}

function moveTrack(i, animate) {
  lbTrack.style.transition = animate ? "" : "none";
  lbTrack.style.transform = `translateX(${-i * 100}%)`;
}

function unzoomAll() {
  lbStrip.querySelectorAll(".frame.zoomed").forEach(f => {
    f.classList.remove("zoomed");
    f.firstElementChild.style.transform = "";
  });
}

// The point under the mouse becomes the centre of the zoom
function setZoomPoint(frame, e) {
  const r = frame.getBoundingClientRect();
  const x = Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100));
  const y = Math.max(0, Math.min(100, (e.clientY - r.top) / r.height * 100));
  frame.firstElementChild.style.transformOrigin = `${x}% ${y}%`;
}

// Only the current image (and, while turning, the previous one) is shown;
// only the current video plays. This avoids black boxes from videos in the background.
function markCurrent(active, keep, play) {
  [...lbTrack.children].forEach((slide, i) => {
    const current = i === active;
    slide.classList.toggle("current", current);
    const shown = current || i === keep;
    slide.style.visibility = shown ? "" : "hidden";
    const v = slide.querySelector("video");
    if (!v) return;
    if (!current) { v.pause(); return; }
    v.preload = "auto";                       // the current video already loads while it slides in
    if (play) {
      // let Firefox draw the video once more from scratch now that it stands still
      v.style.display = "none";
      void v.offsetWidth;
      v.style.display = "";
      v.play().catch(() => {});
    }
  });
}

// Turn to image i (stops at the first and last image)
function goToSlide(i) {
  i = Math.max(0, Math.min(lbList.length - 1, i));
  if (i === stripIndex) return;
  unzoomAll();
  fillAround(i);
  stripTurning = true;
  markCurrent(i, stripIndex, false);         // video waits until it has arrived
  stripIndex = i;
  lbCounter.textContent = `${i + 1} / ${lbList.length}`;
  moveTrack(i, true);
  clearTimeout(turnTimer);
  turnTimer = setTimeout(finishTurn, 800);   // safety net in case the browser skips the animation end
}

// One scroll movement = one image.
// A trackpad keeps sending scroll signals for about a second after the fingers have left it
// ("momentum"); they get weaker and weaker. Those are ignored after turning. A new swipe is
// recognised at once because its signals get stronger again (or go the other way) –
// so you don't have to wait until the momentum has died down.
let wheelLock = false, lastWheel = 0, wheelSum = 0, lockDir = 0, lastAbs = 0, rising = 0, lastTurn = 0;
lightbox.addEventListener("wheel", e => {
  if (!lightbox.classList.contains("strip-mode")) return;
  e.preventDefault();
  const now = performance.now();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? lbStrip.clientWidth : 1;
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
  const abs = Math.abs(d);
  rising = abs > lastAbs + 1 ? rising + 1 : 0;   // how many signals in a row got stronger
  lastAbs = abs;
  const pause = now - lastWheel;
  lastWheel = now;
  if (wheelLock && (pause > 150                                   // the movement had stopped
      || (now - lastTurn > 300 && (Math.sign(d) === -lockDir      // swiped the other way
          || (rising >= 3 && abs > 8))))) {                       // new swipe while momentum was still running
    wheelLock = false;
    wheelSum = 0;
  }
  if (wheelLock) return;
  wheelSum += d;
  if (Math.abs(wheelSum) > 30) {
    lockDir = Math.sign(wheelSum);
    goToSlide(stripIndex + lockDir);
    wheelLock = true;
    wheelSum = 0;
    rising = 0;
    lastTurn = now;
  }
}, { passive: false });

lightbox.addEventListener("click", e => {
  if (!lightbox.classList.contains("strip-mode") || e.target.closest(".close")) return;
  const frame = e.target.closest(".frame");
  if (!frame) { closeLightbox(); return; }    // click on the white area: close
  const el = frame.firstElementChild;
  if (frame.classList.contains("zoomed")) {
    frame.classList.remove("zoomed");
    el.style.transform = "";
  } else {
    unzoomAll();
    setZoomPoint(frame, e);
    frame.classList.add("zoomed");
    el.style.transform = `scale(${CLICK_ZOOM})`;
  }
});

lightbox.addEventListener("mousemove", e => {
  const zoomed = lbStrip.querySelector(".frame.zoomed");
  if (zoomed) setZoomPoint(zoomed, e);       // move the mouse to look around in the zoomed image
});

function showInLightbox(index) {
  resetZoom();
  lbIndex = Math.max(0, Math.min(lbList.length - 1, index));   // stops at the first and last image
  lbStage.replaceChildren(mediaElement(lbList[lbIndex], lbAlt, { eager: true }));
  lbCounter.textContent = `${lbIndex + 1} / ${lbList.length}`;
}

function closeLightbox() {
  const wasOpen = lightbox.classList.contains("open");
  lightbox.classList.remove("open");
  document.body.classList.remove("lightbox-open");
  if (wasOpen) content.querySelectorAll("figure.visible video, .float-area video").forEach(v => v.play().catch(() => {}));   // page videos continue
  lbStage.replaceChildren();
  lbStage.classList.remove("snap");
  lbStage.style.transform = "";
  lbStage.style.opacity = "";
  lightbox.classList.remove("strip-mode");
  lbTrack.replaceChildren();
}

lightbox.querySelector(".close").addEventListener("click", closeLightbox);

// Keyboard: arrow keys and Escape
document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  const strip = lightbox.classList.contains("strip-mode");
  if (e.key === "ArrowRight") {
    if (strip) goToSlide(stripIndex + 1);
    else showInLightbox(lbIndex + 1);
  }
  if (e.key === "ArrowLeft") {
    if (strip) goToSlide(stripIndex - 1);
    else showInLightbox(lbIndex - 1);
  }
  if (e.key === "Escape") closeLightbox();
});

/* ---------- Touch: swipe, pinch-zoom, pan and double-tap like the Photos app ----------
   - not zoomed: swipe left = next image, swipe right = previous image
   - two fingers: zoom in and out (up to MAX_ZOOM)
   - zoomed in: one finger moves the image around
   - double tap: zoom in at that spot / back out                                    */
const MAX_ZOOM = 5;          // maximum magnification
const DOUBLE_TAP_ZOOM = 2.5; // magnification after a double tap
let zoom = { s: 1, x: 0, y: 0 };
let gesture = null;          // the gesture currently in progress
let multiTouch = false;      // true from the moment two fingers touch until all are lifted
let lastTap = null;

const zoomEl = () => lbStage.firstElementChild;
function resetZoom() { zoom = { s: 1, x: 0, y: 0 }; }
function applyZoom(animate) {
  const el = zoomEl();
  if (!el) return;
  el.classList.toggle("zoom-anim", !!animate);
  el.style.transform = zoom.s === 1 && !zoom.x && !zoom.y ? "" : `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`;
}
// Keeps the zoomed picture inside the screen (no panning into empty space)
function clampZoom() {
  const el = zoomEl();
  if (!el) return;
  const w = el.clientWidth, h = el.clientHeight;
  const nw = el.naturalWidth || el.videoWidth || w, nh = el.naturalHeight || el.videoHeight || h;
  const ratio = nw / nh;
  const cw = Math.min(w, h * ratio), ch = Math.min(h, w / ratio);   // visible picture inside the box
  const mx = Math.max(0, (cw * zoom.s - w) / 2), my = Math.max(0, (ch * zoom.s - h) / 2);
  zoom.x = Math.max(-mx, Math.min(mx, zoom.x));
  zoom.y = Math.max(-my, Math.min(my, zoom.y));
}
// Finger position relative to the centre of the image area
function relative(x, y) {
  const r = lbStage.getBoundingClientRect();
  return { x: x - (r.left + r.width / 2), y: y - (r.top + r.height / 2) };
}
function handleTap(x, y) {
  const now = performance.now();
  if (lastTap && now - lastTap.t < 300 && Math.hypot(x - lastTap.x, y - lastTap.y) < 30) {
    if (zoom.s > 1) resetZoom();
    else {
      const p = relative(x, y);
      zoom = { s: DOUBLE_TAP_ZOOM, x: p.x * (1 - DOUBLE_TAP_ZOOM), y: p.y * (1 - DOUBLE_TAP_ZOOM) };
      clampZoom();
    }
    applyZoom(true);
    lastTap = null;
  } else {
    lastTap = { t: now, x, y };
  }
}

lightbox.addEventListener("touchstart", e => {
  if (lightbox.classList.contains("strip-mode")) { gesture = null; return; }   // strip (mouse) handles its own input
  if (e.target.closest(".close")) { gesture = null; return; }   // let the close button work normally
  lbStage.classList.remove("snap");
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    multiTouch = true;
    lbStage.style.transform = "";
    gesture = {
      type: "pinch",
      d0: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
      m0: relative((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2),
      s0: zoom.s, x0: zoom.x, y0: zoom.y
    };
  } else if (e.touches.length === 1 && !multiTouch) {
    const t = e.touches[0];
    gesture = zoom.s > 1
      ? { type: "pan", x: t.clientX, y: t.clientY, x0: zoom.x, y0: zoom.y, dx: 0, dy: 0 }
      : { type: "swipe", x: t.clientX, y: t.clientY, t: performance.now(), dx: 0, dy: 0 };
  }
}, { passive: true });

lightbox.addEventListener("touchmove", e => {
  if (!gesture) return;
  e.preventDefault();                         // keep the browser from scrolling the page
  if (gesture.type === "pinch") {
    if (e.touches.length < 2) return;
    const [a, b] = e.touches;
    const d = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    const m = relative((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    const s = Math.max(1, Math.min(MAX_ZOOM, gesture.s0 * d / gesture.d0));
    // the spot between the fingers stays under the fingers
    const cx = (gesture.m0.x - gesture.x0) / gesture.s0, cy = (gesture.m0.y - gesture.y0) / gesture.s0;
    zoom = { s, x: m.x - cx * s, y: m.y - cy * s };
    clampZoom();
    applyZoom(false);
    return;
  }
  const t = e.touches[0];
  gesture.dx = t.clientX - gesture.x;
  gesture.dy = t.clientY - gesture.y;
  if (gesture.type === "pan") {
    zoom.x = gesture.x0 + gesture.dx;
    zoom.y = gesture.y0 + gesture.dy;
    clampZoom();
    applyZoom(false);
  } else if (Math.abs(gesture.dx) > Math.abs(gesture.dy)) {
    // the image follows the finger; at the first/last image it only gives way a little
    const atEnd = (gesture.dx < 0 && lbIndex === lbList.length - 1) || (gesture.dx > 0 && lbIndex === 0);
    lbStage.style.transform = `translateX(${atEnd ? gesture.dx * 0.25 : gesture.dx}px)`;
  }
}, { passive: false });

function endTouch(e) {
  if (e.touches.length === 0) multiTouch = false;
  if (!gesture) return;
  const g = gesture;
  if (e.cancelable) e.preventDefault();       // no extra click after a gesture

  if (g.type === "pinch") {
    if (e.touches.length < 2) gesture = null;
    if (zoom.s < 1.05) { resetZoom(); applyZoom(true); }
    return;
  }
  gesture = null;
  const isTap = e.type === "touchend" && Math.abs(g.dx) < 10 && Math.abs(g.dy) < 10;

  if (g.type === "pan") {
    if (isTap) handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    return;
  }

  // swipe
  const dx = g.dx;
  const speed = Math.abs(dx) / Math.max(performance.now() - g.t, 1);   // px per ms
  lbStage.classList.add("snap");
  const dir = dx < 0 ? 1 : -1;
  const hasNext = lbIndex + dir >= 0 && lbIndex + dir < lbList.length;   // no turning past the first/last image
  if (e.type === "touchend" && hasNext && Math.abs(dx) > Math.abs(g.dy) && (Math.abs(dx) > 50 || (speed > 0.4 && Math.abs(dx) > 20))) {
    const width = lightbox.clientWidth;
    lbStage.style.transform = `translateX(${-dir * width}px)`;   // slide the old image out
    lbStage.style.opacity = "0";
    setTimeout(() => {
      lbStage.classList.remove("snap");
      showInLightbox(lbIndex + dir);
      lbStage.style.transform = `translateX(${dir * width * 0.3}px)`;   // new image comes from the other side
      requestAnimationFrame(() => requestAnimationFrame(() => {
        lbStage.classList.add("snap");
        lbStage.style.transform = "";
        lbStage.style.opacity = "";
      }));
    }, 200);
  } else {
    lbStage.style.transform = "";             // not far enough: spring back
    if (isTap) handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
}
lightbox.addEventListener("touchend", endTouch);
lightbox.addEventListener("touchcancel", endTouch);

/* ---------- Project pages ---------- */

// Aspect ratio (height / width) of an image or video, known as soon as the browser has read its size
const ratioCache = {};
function ratioOf(src) {
  if (!ratioCache[src]) {
    ratioCache[src] = new Promise(resolve => {
      let done = false, poll;
      const finish = ratio => {
        if (done) return;
        done = true;
        clearInterval(poll);
        resolve(ratio > 0 && isFinite(ratio) ? ratio : 2 / 3);
      };
      setTimeout(() => finish(2 / 3), 8000);
      if (src.toLowerCase().endsWith(".mp4")) {
        const v = document.createElement("video");
        v.preload = "metadata";
        v.muted = true;
        v.onloadedmetadata = () => finish(v.videoHeight / v.videoWidth);
        v.onerror = () => finish(2 / 3);
        v.src = src;
      } else {
        const img = new Image();
        const check = () => { if (img.naturalWidth) finish(img.naturalHeight / img.naturalWidth); };
        img.onload = check;
        img.onerror = () => finish(2 / 3);
        img.src = src;
        poll = setInterval(check, 40);       // the size is often known long before the image has fully loaded
      }
    });
  }
  return ratioCache[src];
}

let relayoutCollage = null;                  // re-arranges the current project page when the window size changes
let observer = null;                         // lets the images appear while scrolling

function projectPage(project) {
  const header = document.createElement("div");
  header.className = "project-header";
  const meta = [project.year, project.place, project.context].filter(Boolean).join(", ");
  header.innerHTML = `<h2>${project.title}</h2><div class="meta">${meta}</div>${project.text ? `<p>${project.text}</p>` : ""}`;

  const collage = document.createElement("div");
  collage.className = "collage";
  content.replaceChildren(header, collage);
  document.title = project.title + " — patrick walter";
  relayoutCollage = null;

  media(project).then(async list => {
    if (location.hash.slice(1) !== project.slug) return;   // another page was opened meanwhile
    // Aspect ratios: saved by the editor in layout.json, so no image has to be loaded in advance.
    // Only files the editor has not seen yet are measured (that loads them once).
    const data = await layoutData;
    const known = (data && data.ratios) || {};
    const folder = fileName(project.title);
    const ratios = await Promise.all(list.map(src => known[`${folder}/${fileOf(src)}`] || ratioOf(src)));
    const saved = await savedLayout(project);
    if (location.hash.slice(1) !== project.slug) return;

    const items = list.map((src, i) => {
      const figure = document.createElement("figure");
      figure.style.zIndex = i + 1;
      figure.style.aspectRatio = 1 / ratios[i];      // reserves the space before the image has loaded
      // images load only when they come near the screen, videos only when they become visible
      figure.appendChild(mediaElement(src, project.title, { videoPreload: "none" }));
      // click opens the full view
      figure.addEventListener("click", () => openLightbox(list, i, project.title));
      collage.appendChild(figure);
      return { figure, file: fileOf(src), ratio: ratios[i] };
    });
    const ratio = new Map(items.map(it => [it.file, it.ratio]));

    // Images not arranged yet: one below the other, alternating left and right (same as in the editor)
    function stack(files, startY, startIndex) {
      let y = startY;
      const w = COLLAGE.newWidth;
      return files.map((file, k) => {
        const x = (startIndex + k) % 2 ? 100 - w - 4 : 4;
        const e = { file, x: Math.max(0, x), y, w };
        y += w * ratio.get(file) + 8;
        return e;
      });
    }

    // Places every image where it was put in the editor (positions in % of the width)
    function layout() {
      if (!collage.isConnected) return;
      const W = collage.clientWidth;
      // upright layout: its own arrangement from the editor if there is one, otherwise the wide one, scaled down
      const arrangement = (saved && (isUpright() && saved.mobile || saved.desktop)) || [];
      let entries = arrangement.filter(e => ratio.has(e.file));
      // files that are not in the arrangement yet (e.g. new ones) go below it
      const missing = items.map(it => it.file).filter(f => !entries.some(e => e.file === f));
      const bottom = Math.max(0, ...entries.map(e => e.y + e.w * ratio.get(e.file)));
      entries = entries.concat(stack(missing, entries.length ? bottom + 8 : 0, entries.length));

      const pos = new Map(entries.map(e => [e.file, e]));
      let end = 0;
      items.forEach(it => {
        const e = pos.get(it.file);
        it.figure.style.setProperty("--x", e.x * W / 100 + "px");
        it.figure.style.setProperty("--y", e.y * W / 100 + "px");
        it.figure.style.setProperty("--w", e.w * W / 100 + "px");
        end = Math.max(end, (e.y + e.w * it.ratio) * W / 100);
      });
      collage.style.height = end + "px";
    }
    layout();
    relayoutCollage = layout;

    // Appear while scrolling
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
          const v = entry.target.querySelector("video");
          if (v) { v.preload = "auto"; v.play().catch(() => {}); }
          observer.unobserve(entry.target);
        }
      });
    }, { rootMargin: "0px 0px -12% 0px" });
    collage.querySelectorAll("figure").forEach(f => observer.observe(f));
  });
}

/* ---------- Info and imprint ---------- */
function textPage(html, title) {
  const div = document.createElement("div");
  div.className = "info";
  div.innerHTML = html;
  content.replaceChildren(div);
  document.title = title + " — patrick walter";
}

/* ---------- Window size changes (also turning the phone) ---------- */
let resizeTimer = null;
function onResize() {
  measureList();
  updateHeaderHeight();
  applyMenu();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => relayoutCollage && relayoutCollage(), 150);
}
window.addEventListener("resize", onResize);
document.fonts?.ready.then(onResize);         // the font changes the size of the menu

/* ---------- Navigation ---------- */
function route() {
  floatRun++;
  closeLightbox();
  const slug = decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll(".sidebar a").forEach(a =>
    a.classList.toggle("active", a.getAttribute("href") === "#" + slug && slug !== ""));
  const project = projects.find(p => p.slug === slug);
  if (project) projectPage(project);
  else if (slug === "info") textPage(infoHTML, "info");
  else if (slug === "imprint") textPage(imprintHTML, "imprint");
  else startPage();
  // upright layout: compact menu on every page except the start page
  document.body.classList.toggle("subpage", slug !== "");
  setMenu(slug !== "" ? 1 : 0, false);         // upright layout: list open on the start page, closed on other pages
  updateHeaderHeight();
  window.scrollTo(0, 0);
  lastScrollY = 0;
  updateShadow();                              // new page starts at the top
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
